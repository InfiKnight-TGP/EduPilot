<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="epGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c6af7" />
      <stop offset="100%" stop-color="#4fd1c5" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#epGrad)" />

  <!-- Graduation Cap & Pilot Star Emblem -->
  <g filter="url(#shadow)">
    <!-- Mortarboard Diamond Top -->
    <polygon points="32,15 54,26 32,37 10,26" fill="url(#capGrad)" />
    
    <!-- Skull Base Cap -->
    <path d="M19,30.5 L19,38.5 C19,45 45,45 45,38.5 L45,30.5 C39,33.5 25,33.5 19,30.5 Z" fill="#f8fafc" opacity="0.95" />
    
    <!-- Golden Tassel -->
    <path d="M32,26 C36,29 48,33 48,40" stroke="#f6ad55" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <circle cx="48" cy="41" r="2.5" fill="#f6ad55" />
    
    <!-- Central AI Star Sparkle -->
    <polygon points="32,21 33.5,24.5 37,26 33.5,27.5 32,31 30.5,27.5 27,26 30.5,24.5" fill="#7c6af7" />
  </g>
</svg>
